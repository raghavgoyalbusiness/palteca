<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#3f7d43" />
  <title>Palteca · learn to speak, visually</title>
  <meta name="description" content="Learn to speak Spanish, French & Mandarin the visual way — see it, hear it, say it. The PALTECA method." />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Palteca" />
  <link rel="icon" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- Top bar -->
    <header id="topbar" hidden>
      <button id="backBtn" class="icon-btn" aria-label="Back">←</button>
      <div id="crumb" class="crumb"></div>
      <button id="playerchip" class="playerchip" aria-label="Your progress" hidden></button>
      <button id="themeToggle" class="icon-btn" aria-label="Toggle dark mode">🌙</button>
    </header>

    <main id="views"><!-- views injected here --></main>
  </div>

  <!-- Toast for speech feedback / errors -->
  <div id="toast" class="toast" hidden></div>

  <script src="store.js"></script>
  <script src="content.js"></script>
  <script src="dialogues.js"></script>
  <script src="app.js"></script>

  <script>
    // PWA: install prompt capture
    var deferredPrompt = null;
    window.__canInstall = false;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferredPrompt = e;
      window.__canInstall = true;
      document.dispatchEvent(new Event('pal:caninstall'));
    });
    window.__promptInstall = function () {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.finally(function () {
        deferredPrompt = null; window.__canInstall = false;
        document.dispatchEvent(new Event('pal:caninstall'));
      });
    };
    window.addEventListener('appinstalled', function () {
      window.__canInstall = false; deferredPrompt = null;
      document.dispatchEvent(new Event('pal:caninstall'));
    });
    // PWA: service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
